name: Release
# Push a tag like v0.2.0 to build the zip and publish it. The zip is built here, from the tagged commit, not on anyone's laptop.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - name: Check the tag matches the app version
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $V"; exit 1; }
      - name: Package
        run: |
          D="pheme-${GITHUB_REF_NAME}"
          mkdir "$D"
          cp dist/pheme.mjs dist/start-pheme.cmd dist/THIRD_PARTY_LICENSES.txt README.md LICENSE THIRD_PARTY_NOTICES.md "$D/"
          zip -qr "$D.zip" "$D"
          unzip -l "$D.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "pheme-${GITHUB_REF_NAME}.zip" --title "Pheme ${GITHUB_REF_NAME}" --generate-notes
