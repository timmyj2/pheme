<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Pheme</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var b = JSON.parse(localStorage.getItem("pheme-theme-boot") || "null");
        if (b && typeof b.bg === "string" && typeof b.fg === "string") {
          var r = document.documentElement;
          r.style.setProperty("--dt-background", b.bg);
          r.style.setProperty("--dt-foreground", b.fg);
          r.classList.toggle("dark", !!b.dark);
          r.style.colorScheme = b.dark ? "dark" : "light";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
